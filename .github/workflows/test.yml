name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  scanner-regression-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax check scanner.js and index.html's inline scripts
        run: |
          node --check scanner.js
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('index.html', 'utf8');
            const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(m => m[1]);
            const vm = require('vm');
            scripts.forEach((s, i) => {
              fs.writeFileSync('/tmp/inline_' + i + '.js', s);
            });
            console.log('extracted', scripts.length, 'inline script blocks');
          "
          for f in /tmp/inline_*.js; do node --check "$f"; done
      - name: Run scanner regression tests (includes real DVWA fixtures)
        run: node tests/scanner.test.js
