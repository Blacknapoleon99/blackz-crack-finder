name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  scanner-regression-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax check every shipped script
        run: |
          node --check scanner.js
          node --check app.js
          node --check assets/portrait.js

      - name: Rule-engine regression tests (includes real DVWA fixtures)
        run: node tests/scanner.test.js

      - name: UI smoke test (drives all 3 scan modes against a DOM stub)
        run: node tests/ui.smoke.js

      - name: No runtime dependencies, ever
        run: |
          test ! -f package.json || { echo "package.json appeared — this project must stay dependency-free"; exit 1; }
          test ! -d node_modules || { echo "node_modules appeared"; exit 1; }
