name: deploy

# Publishes the static site to GitHub Pages on every push to main, but only
# after the test job has passed — a broken scanner should never reach the
# public URL. There is no build step: the repo root IS the site.
#
# ONE-TIME SETUP (required once, by a repo admin):
#   Settings -> Pages -> Source: "GitHub Actions"
# or, with the gh CLI:
#   gh api -X POST repos/OWNER/REPO/pages -f build_type=workflow
#
# This cannot be automated from inside the workflow: creating a Pages site
# needs the `administration` scope, and the default GITHUB_TOKEN doesn't have
# it (verified — it fails with "Resource not accessible by integration").

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let a newer push supersede an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node tests/scanner.test.js
      - run: node tests/ui.smoke.js

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
